[project]
name = "azul-evidence-brief"
version = "0.1.0"
description = "Evidence-grounded account-to-campaign briefing MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111", "uvicorn>=0.30",
  "httpx>=0.27", "pydantic>=2.7", "openai>=1.35"
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.2", "streamlit>=1.36"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["azulbrief*"]

[tool.vercel]
entrypoint = "api:app"
